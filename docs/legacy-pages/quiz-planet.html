<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://unpkg.com" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/@fortawesome/fontawesome-free@6.7.2/js/all.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * {
      scrollbar-width: none;
      scrollbar-color: rgba(0, 0, 0, 0.2) transparent;
    }
  </style>
</head>

<body class="bg-[#0D1B2A] min-h-screen font-body text-gray-100">

<link rel="stylesheet" href="https://fonts.googleapis.cn/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=ZCOOL+QingKe+HuangYou&display=swap" />

<style type="text/tailwindcss">
  @theme {
    --color-primary: #2BA4A0;
    --color-primary-dark: #1E8C88;
    --color-primary-light: #E0F5F4;
    --color-accent: #F5A623;
    --color-accent-light: #FFF3DC;
    --color-surface: #FFFFFF;
    --color-dark: #1A2A3A;
    --color-muted: #8A9BAE;
    --color-success: #34C759;
    --color-warning: #FF9500;
    --color-danger: #FF3B30;
    --color-space-bg: #0D1B2A;
    --color-space-surface: #1B2D44;
    --font-display: 'ZCOOL QingKe HuangYou', cursive;
    --font-body: 'Noto Sans SC', sans-serif;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }
  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-12px); }
  }
  @keyframes orbitSlow {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .star {
    animation: twinkle var(--dur, 3s) ease-in-out infinite;
    animation-delay: var(--delay, 0s);
  }
  .planet-float {
    animation: float 4s ease-in-out infinite;
  }
  .planet-card {
    transition: all 0.3s ease;
    cursor: pointer;
  }
  .planet-card:hover {
    transform: scale(1.05);
  }
  .planet-card:hover .planet-glow {
    opacity: 0.6;
  }
  .orbit-ring {
    animation: orbitSlow 40s linear infinite;
  }
</style>

<!-- Top Navigation (space themed) -->
<nav class="fixed top-0 left-0 right-0 bg-space-bg/80 backdrop-blur-md z-50 border-b border-white/5">
  <div class="max-w-6xl mx-auto px-6 h-14 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <a href="#" class="flex items-center gap-2 text-muted hover:text-primary transition-colors">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        <span class="text-sm">返回首页</span>
      </a>
      <div class="w-px h-5 bg-white/10 mx-2"></div>
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 rounded-lg bg-primary flex items-center justify-center">
          <span class="text-white font-display text-sm">问</span>
        </div>
        <span class="font-display text-lg text-white">答题星球</span>
      </div>
    </div>
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-1.5 bg-accent/15 rounded-full px-3 py-1">
        <i data-lucide="coins" class="w-4 h-4 text-accent"></i>
        <span class="text-sm font-semibold text-accent">128</span>
      </div>
      <div class="w-8 h-8 rounded-full bg-primary/20 flex items-center justify-center">
        <span class="text-primary font-semibold text-sm">明</span>
      </div>
    </div>
  </div>
</nav>

<!-- Star Background -->
<div class="fixed inset-0 z-0 pointer-events-none overflow-hidden">
  <svg width="100%" height="100%" class="absolute inset-0">
    <circle cx="10%" cy="15%" r="1.5" fill="white" class="star" style="--dur:2.5s;--delay:0s"/>
    <circle cx="25%" cy="8%" r="1" fill="white" class="star" style="--dur:3.5s;--delay:0.5s"/>
    <circle cx="40%" cy="22%" r="1.2" fill="white" class="star" style="--dur:4s;--delay:1s"/>
    <circle cx="55%" cy="12%" r="0.8" fill="white" class="star" style="--dur:2s;--delay:0.3s"/>
    <circle cx="70%" cy="18%" r="1.5" fill="white" class="star" style="--dur:3s;--delay:1.5s"/>
    <circle cx="85%" cy="10%" r="1" fill="white" class="star" style="--dur:3.8s;--delay:0.8s"/>
    <circle cx="92%" cy="25%" r="0.7" fill="white" class="star" style="--dur:2.8s;--delay:2s"/>
    <circle cx="15%" cy="50%" r="1" fill="white" class="star" style="--dur:3.2s;--delay:0.4s"/>
    <circle cx="80%" cy="55%" r="1.3" fill="white" class="star" style="--dur:4.2s;--delay:1.2s"/>
    <circle cx="5%" cy="75%" r="0.8" fill="white" class="star" style="--dur:2.6s;--delay:0.9s"/>
    <circle cx="35%" cy="80%" r="1.1" fill="white" class="star" style="--dur:3.6s;--delay:1.8s"/>
    <circle cx="60%" cy="70%" r="0.9" fill="white" class="star" style="--dur:2.4s;--delay:0.2s"/>
    <circle cx="90%" cy="80%" r="1.4" fill="white" class="star" style="--dur:3.3s;--delay:1.1s"/>
    <circle cx="48%" cy="40%" r="0.6" fill="white" class="star" style="--dur:4.5s;--delay:0.7s"/>
    <circle cx="75%" cy="40%" r="0.8" fill="white" class="star" style="--dur:2.9s;--delay:1.4s"/>
    <circle cx="20%" cy="35%" r="1.2" fill="white" class="star" style="--dur:3.1s;--delay:0.6s"/>
    <circle cx="65%" cy="90%" r="1" fill="white" class="star" style="--dur:3.7s;--delay:2.2s"/>
  </svg>
</div>

<!-- Main Content -->
<main class="relative z-10 pt-24 pb-16 max-w-5xl mx-auto px-6">

  <!-- Title Section -->
  <div class="text-center mb-16">
    <h1 class="font-display text-4xl text-white mb-3">探索数学星球 🚀</h1>
    <p class="text-white/50 text-base">选择一颗星球，开始你的数学复习之旅</p>
  </div>

  <!-- Planets Grid -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-10 items-center">

    <!-- Planet 1: 勾股定理 -->
    <div class="planet-card flex flex-col items-center" style="animation: float 4s ease-in-out infinite; animation-delay: 0s;">
      <div class="relative mb-6">
        <!-- Glow -->
        <div class="planet-glow absolute inset-0 rounded-full bg-primary blur-3xl opacity-30 scale-110 transition-opacity"></div>
        <!-- Orbit ring -->
        <div class="absolute -inset-4">
          <svg viewBox="0 0 200 200" class="w-full h-full orbit-ring" style="animation-duration: 30s">
            <circle cx="100" cy="100" r="90" fill="none" stroke="rgba(43,164,160,0.15)" stroke-width="1" stroke-dasharray="4 8"/>
            <circle cx="100" cy="10" r="4" fill="#2BA4A0" opacity="0.6"/>
          </svg>
        </div>
        <!-- Planet sphere -->
        <div class="w-40 h-40 rounded-full relative overflow-hidden" style="background: radial-gradient(circle at 35% 35%, #5EDBD6, #2BA4A0 50%, #1A7A77 100%);">
          <div class="absolute inset-0 flex items-center justify-center">
            <svg viewBox="0 0 60 60" class="w-16 h-16 opacity-90">
              <polygon points="10,50 50,50 50,18" fill="none" stroke="white" stroke-width="2.5" stroke-linejoin="round"/>
              <rect x="44" y="44" width="6" height="6" fill="white" opacity="0.5"/>
            </svg>
          </div>
          <!-- Shine -->
          <div class="absolute top-3 left-5 w-8 h-4 bg-white/25 rounded-full blur-sm"></div>
        </div>
      </div>
      <h3 class="font-display text-xl text-white mb-1">勾股定理</h3>
      <p class="text-white/40 text-sm mb-3">直角三角形的奥秘</p>
      <div class="flex items-center gap-2">
        <div class="flex">
          <i data-lucide="star" class="w-4 h-4 text-accent fill-accent"></i>
          <i data-lucide="star" class="w-4 h-4 text-accent fill-accent"></i>
          <i data-lucide="star" class="w-4 h-4 text-accent fill-accent"></i>
        </div>
        <span class="text-xs text-success font-medium">已掌握</span>
      </div>
      <button class="mt-4 bg-primary/20 hover:bg-primary/30 text-primary border border-primary/30 px-6 py-2 rounded-full text-sm font-medium transition-colors">
        进入复习
      </button>
    </div>

    <!-- Planet 2: 三角形内角和 -->
    <div class="planet-card flex flex-col items-center" style="animation: float 4s ease-in-out infinite; animation-delay: 1.3s;">
      <div class="relative mb-6">
        <div class="planet-glow absolute inset-0 rounded-full bg-accent blur-3xl opacity-30 scale-110 transition-opacity"></div>
        <div class="absolute -inset-4">
          <svg viewBox="0 0 200 200" class="w-full h-full orbit-ring" style="animation-duration: 36s">
            <circle cx="100" cy="100" r="90" fill="none" stroke="rgba(245,166,35,0.15)" stroke-width="1" stroke-dasharray="4 8"/>
            <circle cx="190" cy="100" r="4" fill="#F5A623" opacity="0.6"/>
          </svg>
        </div>
        <div class="w-44 h-44 rounded-full relative overflow-hidden" style="background: radial-gradient(circle at 35% 35%, #FFD078, #F5A623 50%, #D4880C 100%);">
          <div class="absolute inset-0 flex items-center justify-center">
            <svg viewBox="0 0 60 60" class="w-16 h-16 opacity-90">
              <polygon points="30,8 6,52 54,52" fill="none" stroke="white" stroke-width="2.5" stroke-linejoin="round"/>
              <text x="30" y="42" fill="white" font-size="10" text-anchor="middle" font-weight="600">180°</text>
            </svg>
          </div>
          <div class="absolute top-4 left-6 w-10 h-5 bg-white/25 rounded-full blur-sm"></div>
        </div>
      </div>
      <h3 class="font-display text-xl text-white mb-1">三角形内角和</h3>
      <p class="text-white/40 text-sm mb-3">角度的完美平衡</p>
      <div class="flex items-center gap-2">
        <div class="flex">
          <i data-lucide="star" class="w-4 h-4 text-accent fill-accent"></i>
          <i data-lucide="star" class="w-4 h-4 text-accent fill-accent"></i>
          <i data-lucide="star" class="w-4 h-4 text-white/20"></i>
        </div>
        <span class="text-xs text-warning font-medium">学习中</span>
      </div>
      <button class="mt-4 bg-accent/20 hover:bg-accent/30 text-accent border border-accent/30 px-6 py-2 rounded-full text-sm font-medium transition-colors">
        继续答题
      </button>
    </div>

    <!-- Planet 3: 一次函数 -->
    <div class="planet-card flex flex-col items-center" style="animation: float 4s ease-in-out infinite; animation-delay: 2.6s;">
      <div class="relative mb-6">
        <div class="planet-glow absolute inset-0 rounded-full bg-[#6C8EBF] blur-3xl opacity-30 scale-110 transition-opacity"></div>
        <div class="absolute -inset-4">
          <svg viewBox="0 0 200 200" class="w-full h-full orbit-ring" style="animation-duration: 42s">
            <circle cx="100" cy="100" r="90" fill="none" stroke="rgba(108,142,191,0.15)" stroke-width="1" stroke-dasharray="4 8"/>
            <circle cx="100" cy="190" r="4" fill="#6C8EBF" opacity="0.6"/>
          </svg>
        </div>
        <div class="w-40 h-40 rounded-full relative overflow-hidden" style="background: radial-gradient(circle at 35% 35%, #9CB8DD, #6C8EBF 50%, #4A6E9C 100%);">
          <div class="absolute inset-0 flex items-center justify-center">
            <svg viewBox="0 0 60 60" class="w-16 h-16 opacity-90">
              <line x1="10" y1="50" x2="50" y2="10" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
              <line x1="10" y1="10" x2="10" y2="52" stroke="white" stroke-width="1.5" opacity="0.5"/>
              <line x1="8" y1="52" x2="52" y2="52" stroke="white" stroke-width="1.5" opacity="0.5"/>
            </svg>
          </div>
          <div class="absolute top-3 left-5 w-8 h-4 bg-white/25 rounded-full blur-sm"></div>
        </div>
      </div>
      <h3 class="font-display text-xl text-white mb-1">一次函数</h3>
      <p class="text-white/40 text-sm mb-3">直线的方程密码</p>
      <div class="flex items-center gap-2">
        <div class="flex">
          <i data-lucide="star" class="w-4 h-4 text-accent fill-accent"></i>
          <i data-lucide="star" class="w-4 h-4 text-accent fill-accent"></i>
          <i data-lucide="star" class="w-4 h-4 text-white/20"></i>
        </div>
        <span class="text-xs text-warning font-medium">学习中</span>
      </div>
      <button class="mt-4 bg-[#6C8EBF]/20 hover:bg-[#6C8EBF]/30 text-[#6C8EBF] border border-[#6C8EBF]/30 px-6 py-2 rounded-full text-sm font-medium transition-colors">
        继续答题
      </button>
    </div>

  </div>

  <!-- Bottom Stats -->
  <div class="mt-16 bg-space-surface/50 backdrop-blur-sm rounded-2xl border border-white/5 p-6">
    <div class="flex items-center justify-around">
      <div class="text-center">
        <p class="text-2xl font-bold text-white">42</p>
        <p class="text-xs text-white/40 mt-1">总答题数</p>
      </div>
      <div class="w-px h-10 bg-white/10"></div>
      <div class="text-center">
        <p class="text-2xl font-bold text-success">78%</p>
        <p class="text-xs text-white/40 mt-1">正确率</p>
      </div>
      <div class="w-px h-10 bg-white/10"></div>
      <div class="text-center">
        <p class="text-2xl font-bold text-accent">5</p>
        <p class="text-xs text-white/40 mt-1">连续答对</p>
      </div>
      <div class="w-px h-10 bg-white/10"></div>
      <div class="text-center">
        <p class="text-2xl font-bold text-primary">Lv3</p>
        <p class="text-xs text-white/40 mt-1">当前等级</p>
      </div>
    </div>
  </div>

</main>

</body>
<script>if (window.lucide) lucide.createIcons();</script>
</html>
