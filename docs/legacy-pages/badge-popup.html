<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://unpkg.com" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/@fortawesome/fontawesome-free@6.7.2/js/all.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * {
      scrollbar-width: none;
      scrollbar-color: rgba(0, 0, 0, 0.2) transparent;
    }
  </style>
</head>

<body class="bg-[#F0F7F7] min-h-screen font-body text-gray-800">

<link rel="stylesheet" href="https://fonts.googleapis.cn/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=ZCOOL+QingKe+HuangYou&display=swap" />

<style type="text/tailwindcss">
  @theme {
    --color-primary: #2BA4A0;
    --color-primary-dark: #1E8C88;
    --color-primary-light: #E0F5F4;
    --color-accent: #F5A623;
    --color-accent-light: #FFF3DC;
    --color-surface: #FFFFFF;
    --color-dark: #1A2A3A;
    --color-muted: #8A9BAE;
    --color-success: #34C759;
    --color-warning: #FF9500;
    --color-danger: #FF3B30;
    --font-display: 'ZCOOL QingKe HuangYou', cursive;
    --font-body: 'Noto Sans SC', sans-serif;
  }

  @keyframes popIn {
    0% { transform: scale(0.5); opacity: 0; }
    60% { transform: scale(1.05); }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes shimmer {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  @keyframes confettiDrop {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(60px) rotate(720deg); opacity: 0; }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes badgeBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .popup-overlay {
    animation: fadeIn 0.3s ease;
  }
  .popup-content {
    animation: popIn 0.5s ease forwards;
  }
  .badge-shimmer {
    animation: shimmer 6s linear infinite;
  }
  .confetti {
    animation: confettiDrop 2s ease-in-out infinite;
  }
  .badge-icon-bounce {
    animation: badgeBounce 2s ease-in-out infinite;
  }
</style>

<!-- Background Page (Dimmed) -->
<div class="min-h-screen bg-[#F0F7F7]">

  <!-- Simulated page behind (dimmed) -->
  <nav class="bg-surface/90 border-b border-primary/10">
    <div class="max-w-4xl mx-auto px-6 h-14 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 rounded-lg bg-primary flex items-center justify-center">
          <span class="text-white font-display text-sm">问</span>
        </div>
        <span class="font-display text-lg text-dark">标准题训练</span>
      </div>
    </div>
  </nav>

  <div class="max-w-4xl mx-auto px-6 py-8 opacity-30">
    <div class="bg-surface rounded-2xl p-8">
      <p class="text-dark">在直角三角形中，已知两条直角边分别为 5cm 和 12cm...</p>
    </div>
  </div>

  <!-- Modal Overlay -->
  <div class="popup-overlay fixed inset-0 bg-dark/60 backdrop-blur-sm z-50 flex items-center justify-center p-6">

    <!-- Confetti particles -->
    <div class="absolute inset-0 pointer-events-none overflow-hidden">
      <div class="confetti absolute left-[15%] top-[20%] w-3 h-3 bg-accent rounded-sm" style="animation-delay: 0s; animation-duration: 2.5s;"></div>
      <div class="confetti absolute left-[25%] top-[15%] w-2 h-4 bg-primary rounded-sm" style="animation-delay: 0.3s; animation-duration: 2.8s;"></div>
      <div class="confetti absolute left-[40%] top-[10%] w-3 h-2 bg-danger rounded-sm" style="animation-delay: 0.6s; animation-duration: 2.2s;"></div>
      <div class="confetti absolute left-[55%] top-[18%] w-2 h-3 bg-success rounded-sm" style="animation-delay: 0.2s; animation-duration: 3s;"></div>
      <div class="confetti absolute left-[70%] top-[12%] w-3 h-3 bg-[#8B5CF6] rounded-sm" style="animation-delay: 0.5s; animation-duration: 2.6s;"></div>
      <div class="confetti absolute left-[82%] top-[20%] w-2 h-4 bg-accent rounded-sm" style="animation-delay: 0.8s; animation-duration: 2.3s;"></div>
      <div class="confetti absolute left-[35%] top-[25%] w-4 h-2 bg-primary rounded-sm" style="animation-delay: 1s; animation-duration: 2.7s;"></div>
      <div class="confetti absolute left-[60%] top-[22%] w-2 h-2 bg-warning rounded-full" style="animation-delay: 0.4s; animation-duration: 2.4s;"></div>
    </div>

    <!-- Popup Card -->
    <div class="popup-content bg-surface rounded-3xl shadow-2xl max-w-md w-full overflow-hidden relative">
      <!-- Top decoration -->
      <div class="h-32 bg-gradient-to-br from-accent to-[#FFB84D] relative flex items-center justify-center">
        <!-- Shimmer ring -->
        <div class="absolute">
          <svg viewBox="0 0 120 120" class="w-28 h-28 badge-shimmer">
            <circle cx="60" cy="60" r="55" fill="none" stroke="white" stroke-width="1" opacity="0.3" stroke-dasharray="8 6"/>
          </svg>
        </div>
        <!-- Badge icon -->
        <div class="badge-icon-bounce w-20 h-20 rounded-2xl bg-white shadow-lg flex items-center justify-center relative z-10">
          <svg viewBox="0 0 48 48" class="w-12 h-12">
            <circle cx="24" cy="20" r="14" fill="#F5A623" opacity="0.15"/>
            <path d="M24 6 L28 16 L38 17 L30 24 L32 34 L24 29 L16 34 L18 24 L10 17 L20 16 Z" fill="#F5A623" stroke="#D4880C" stroke-width="1"/>
            <text x="24" y="24" fill="white" font-size="8" text-anchor="middle" font-weight="bold">★</text>
          </svg>
        </div>
        <!-- Close button -->
        <button class="absolute top-4 right-4 w-8 h-8 rounded-full bg-white/20 hover:bg-white/30 flex items-center justify-center transition-colors">
          <i data-lucide="x" class="w-4 h-4 text-white"></i>
        </button>
      </div>

      <!-- Content -->
      <div class="px-8 py-6 text-center">
        <h2 class="font-display text-2xl text-dark mb-1">恭喜获得新徽章！🎉</h2>
        <p class="text-muted text-sm mb-6">你连续答对了 3 道题，获得了以下成就</p>

        <!-- Badge Details -->
        <div class="bg-accent-light/50 rounded-2xl p-5 mb-6">
          <div class="w-16 h-16 rounded-xl bg-accent/15 flex items-center justify-center mx-auto mb-3">
            <span class="text-3xl">⭐</span>
          </div>
          <h3 class="font-semibold text-dark text-lg">答题达人</h3>
          <p class="text-muted text-sm mt-1">连续答对 3 道题，思维敏捷！</p>
          <p class="text-accent text-xs font-medium mt-2">+10 积分奖励</p>
        </div>

        <!-- All Badges Collection -->
        <div class="mb-6">
          <p class="text-xs text-muted mb-3 text-left">已收集的徽章</p>
          <div class="grid grid-cols-5 gap-3">
            <!-- Earned badges -->
            <div class="text-center">
              <div class="w-12 h-12 rounded-xl bg-primary-light flex items-center justify-center mx-auto mb-1">
                <span class="text-xl">🌱</span>
              </div>
              <p class="text-[10px] text-dark font-medium">初来乍到</p>
            </div>
            <div class="text-center">
              <div class="w-12 h-12 rounded-xl bg-accent-light flex items-center justify-center mx-auto mb-1 ring-2 ring-accent/30">
                <span class="text-xl">⭐</span>
              </div>
              <p class="text-[10px] text-accent font-semibold">答题达人</p>
            </div>
            <!-- Locked badges -->
            <div class="text-center opacity-40">
              <div class="w-12 h-12 rounded-xl bg-gray-100 flex items-center justify-center mx-auto mb-1">
                <span class="text-xl grayscale">📅</span>
              </div>
              <p class="text-[10px] text-muted">七日之约</p>
            </div>
            <div class="text-center opacity-40">
              <div class="w-12 h-12 rounded-xl bg-gray-100 flex items-center justify-center mx-auto mb-1">
                <span class="text-xl grayscale">💯</span>
              </div>
              <p class="text-[10px] text-muted">百题斩</p>
            </div>
            <div class="text-center opacity-40">
              <div class="w-12 h-12 rounded-xl bg-gray-100 flex items-center justify-center mx-auto mb-1">
                <span class="text-xl grayscale">🏆</span>
              </div>
              <p class="text-[10px] text-muted">光荣退役</p>
            </div>
          </div>
        </div>

        <!-- Action -->
        <button class="w-full bg-primary hover:bg-primary-dark text-white font-semibold py-3 rounded-xl transition-colors text-sm">
          太棒了，继续答题！
        </button>
        <button class="w-full mt-2 text-muted hover:text-primary text-sm transition-colors py-2">
          查看所有成就 →
        </button>
      </div>
    </div>
  </div>

</div>

</body>
<script>if (window.lucide) lucide.createIcons();</script>
</html>
